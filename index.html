<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة اللعبة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d0b14;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 380px;
            background: #141024;
            border: 2px solid #5d259e;
            border-radius: 18px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(93, 37, 158, 0.4);
        }
        .title {
            text-align: center;
            font-size: 22px;
            color: #d1a8ff;
            text-shadow: 0 0 10px #8a3ffc;
            margin-bottom: 12px;
        }
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: #1b1333;
            border: 1px solid #7938cf;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .grid {
            display: flex;
            flex-direction: column-reverse; /* لجعل الصف الأول يبدأ من الأسفل */
            gap: 6px;
            background: #0b0817;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #361f5c;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cells {
            display: flex;
            gap: 6px;
        }
        .cell {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: radial-gradient(circle, #b97637, #5c2f0f);
            border: 2px solid #3f220f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.2s;
        }
        .cell:hover {
            transform: scale(1.05);
        }
        .cell.safe {
            background: #198754;
            border-color: #20c997;
        }
        .cell.bomb {
            background: #dc3545;
            border-color: #ff6b6b;
        }
        .multiplier {
            font-size: 11px;
            color: #d1a8ff;
            min-width: 55px;
            text-align: left;
            direction: ltr;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #8a3ffc;
            background: #241442;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn:hover {
            background: #391c6e;
        }
        .status-msg {
            text-align: center;
            margin-top: 10px;
            font-size: 13px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">سكربت أبو علاء</div>
    
    <div class="info-bar">
        <span>Your ID: 55255347622</span>
        <span>Online Users: 204</span>
    </div>

    <div class="grid" id="grid"></div>

    <div class="status-msg" id="statusMsg"></div>

    <div class="controls">
        <button class="btn" onclick="startPrediction()">START</button>
        <button class="btn" onclick="resetGrid()">RESET</button>
    </div>
</div>

<script>
    const ROWS = 10;
    const COLS = 5;
    const multipliers = [
        "x1.23", "x1.54", "x1.93", "x2.41", "x4.02",
        "x6.71", "x11.18", "x27.97", "x69.93", "x349.68"
    ];

    const gridEl = document.getElementById('grid');
    const statusMsg = document.getElementById('statusMsg');

    function buildGrid() {
        gridEl.innerHTML = '';
        for (let r = 0; r < ROWS; r++) {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'row';

            const cellsDiv = document.createElement('div');
            cellsDiv.className = 'cells';

            for (let c = 0; c < COLS; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                cellsDiv.appendChild(cell);
            }

            const multDiv = document.createElement('span');
            multDiv.className = 'multiplier';
            multDiv.textContent = `${multipliers[r]} ✿`;

            rowDiv.appendChild(cellsDiv);
            rowDiv.appendChild(multDiv);
            gridEl.appendChild(rowDiv);
        }
    }

    function resetGrid() {
        buildGrid();
        statusMsg.textContent = 'تمت إعادة الضبط';
        statusMsg.style.color = '#fff';
    }

    // محاكاة وضع التوقع/التشغيل
    function startPrediction() {
        resetGrid();
        statusMsg.textContent = 'جاري التحليل وتحديد المسار...';
        statusMsg.style.color = '#ffc107';

        let currentRow = 0;
        const interval = setInterval(() => {
            if (currentRow >= ROWS) {
                clearInterval(interval);
                statusMsg.textContent = 'اكتمل تحديد المسار بنجاح!';
                statusMsg.style.color = '#20c997';
                return;
            }

            // اختيار مكان الخلية الآمنة عشوائياً لكل صف
            const safeCol = Math.floor(Math.random() * COLS);
            const targetCell = document.getElementById(`cell-${currentRow}-${safeCol}`);
            
            if (targetCell) {
                targetCell.classList.add('safe');
                targetCell.innerHTML = '🍏';
            }

            currentRow++;
        }, 250);
    }

    // بناء الشبكة عند التحميل الأول
    buildGrid();
</script>

</body>
</html>
